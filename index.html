<!-- ==========================================
     GOOGLE ANALYTICS 4 — РАСШИРЕННОЕ ОТСЛЕЖИВАНИЕ
     Вставить в <head> ВМЕСТО стандартного кода GA4
     ========================================== -->

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-Q9V45QP5LP"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  // Базовая конфигурация с расширенными настройками
  gtag('config', 'G-Q9V45QP5LP', {
    // Отслеживание кликов, скролла, форм — автоматически
    send_page_view: true,
    cookie_flags: 'SameSite=None;Secure',
    // Хранить cookie 2 года
    cookie_expires: 63072000
  });

  // ── COOKIE-ХЕЛПЕРЫ ──────────────────────────────
  function setCookie(name, value, days) {
    var date = new Date();
    date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
    document.cookie = name + '=' + encodeURIComponent(value)
      + '; expires=' + date.toUTCString()
      + '; path=/; SameSite=Lax';
  }

  function getCookie(name) {
    var nameEQ = name + '=';
    var ca = document.cookie.split(';');
    for (var i = 0; i < ca.length; i++) {
      var c = ca[i].trim();
      if (c.indexOf(nameEQ) === 0)
        return decodeURIComponent(c.substring(nameEQ.length));
    }
    return null;
  }

  // ── СОХРАНЯЕМ UTM-МЕТКИ В COOKIE ────────────────
  // Нужно для атрибуции если пользователь вернётся позже
  (function saveUtm() {
    var params = ['utm_source','utm_medium','utm_campaign','utm_content','utm_term','gclid'];
    var search = window.location.search;
    if (!search) return;
    var urlParams = new URLSearchParams(search);
    var snapshot = {};
    params.forEach(function(p) {
      var val = urlParams.get(p);
      if (val) {
        setCookie('_ga_' + p, val, 30);
        snapshot[p] = val;
      }
    });
    if (Object.keys(snapshot).length > 0) {
      setCookie('_ga_utm_snapshot', JSON.stringify(snapshot), 30);
      // Передаём UTM в GA4 как user properties
      gtag('set', 'user_properties', snapshot);
    }
  })();

  // ── УНИКАЛЬНЫЙ ID ПОСЕТИТЕЛЯ ────────────────────
  (function setUserId() {
    var uid = getCookie('_ga_user_id');
    if (!uid) {
      uid = 'u_' + Math.random().toString(36).substr(2,9) + '_' + Date.now();
      setCookie('_ga_user_id', uid, 365);
    }
    gtag('set', { 'user_id': uid });
  })();

  // ── СОБЫТИЯ ПОСЛЕ ЗАГРУЗКИ СТРАНИЦЫ ────────────
  document.addEventListener('DOMContentLoaded', function() {

    // 1. КЛИК НА КНОПКУ ПОКУПКИ → событие конверсии
    var buyButtons = document.querySelectorAll('a[href*="tribute"], a[href*="t.me"]');
    buyButtons.forEach(function(btn, i) {
      btn.addEventListener('click', function() {
        gtag('event', 'purchase_click', {
          event_category: 'conversion',
          event_label: btn.innerText.trim() || 'CTA button ' + (i+1),
          value: 890,
          currency: 'RUB'
        });
        // Основное событие конверсии GA4
        gtag('event', 'begin_checkout', {
          currency: 'RUB',
          value: 890,
          items: [{
            item_name: 'Конструктор контента 30 каруселей',
            item_category: 'SMM',
            price: 890,
            quantity: 1
          }]
        });
        setCookie('_ga_checkout_intent', '1', 7);
      });
    });

    // 2. ГЛУБИНА СКРОЛЛА — 25%, 50%, 75%, 90%
    var scrollFired = {};
    window.addEventListener('scroll', function() {
      var pct = Math.round(
        (window.scrollY / (document.body.scrollHeight - window.innerHeight)) * 100
      );
      [25, 50, 75, 90].forEach(function(threshold) {
        if (pct >= threshold && !scrollFired[threshold]) {
          scrollFired[threshold] = true;
          gtag('event', 'scroll_depth', {
            event_category: 'engagement',
            event_label: threshold + '%',
            value: threshold
          });
          // На 90% — считаем как высокий интерес
          if (threshold === 90) {
            gtag('event', 'high_intent_scroll', {
              event_category: 'conversion',
              event_label: 'Прочитал почти всё'
            });
          }
        }
      });
    }, { passive: true });

    // 3. ВРЕМЯ НА СТРАНИЦЕ — 30сек, 60сек, 3мин
    var timeFired = {};
    [[30,'30 секунд'], [60,'1 минута'], [180,'3 минуты']].forEach(function(t) {
      setTimeout(function() {
        if (!timeFired[t[0]]) {
          timeFired[t[0]] = true;
          gtag('event', 'time_on_page', {
            event_category: 'engagement',
            event_label: t[1],
            value: t[0]
          });
        }
      }, t[0] * 1000);
    });

    // 4. ПРОСМОТР БЛОКА С ЦЕНОЙ (ViewContent)
    var priceSection = document.querySelector('section, .price, h2, .offer');
    // Ищем блок с текстом про цену
    var allElements = document.querySelectorAll('*');
    for (var i = 0; i < allElements.length; i++) {
      if (allElements[i].innerText && allElements[i].innerText.includes('890')) {
        priceSection = allElements[i];
        break;
      }
    }
    if (priceSection && 'IntersectionObserver' in window) {
      var priceObserved = false;
      var priceObserver = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
          if (entry.isIntersecting && !priceObserved) {
            priceObserved = true;
            gtag('event', 'view_price_block', {
              event_category: 'engagement',
              event_label: 'Увидел цену 890₽'
            });
            // Стандартное событие GA4
            gtag('event', 'view_item', {
              currency: 'RUB',
              value: 890,
              items: [{
                item_name: 'Конструктор контента',
                price: 890
              }]
            });
          }
        });
      }, { threshold: 0.5 });
      priceObserver.observe(priceSection);
    }

    // 5. УХОД СО СТРАНИЦЫ (exit intent) — мышь к верхнему краю
    var exitFired = false;
    document.addEventListener('mouseleave', function(e) {
      if (e.clientY <= 5 && !exitFired) {
        exitFired = true;
        gtag('event', 'exit_intent', {
          event_category: 'engagement',
          event_label: 'Попытка закрыть страницу'
        });
      }
    });

  }); // end DOMContentLoaded
</script>
<!-- End Google Analytics 4 -->
